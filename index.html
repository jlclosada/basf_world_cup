<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BASF-RG Team World Cup 2026 ⚽</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="ball">⚽</span>
        <div>
          <h1 id="title">BASF-RG Team World Cup 2026</h1>
          <p class="subtitle" id="subtitle">The office prediction pool</p>
        </div>
      </div>
      <div class="user-box">
        <span id="userLabel" class="user-label hidden"></span>
        <button id="changeUserBtn" class="btn ghost hidden">Change</button>
      </div>
    </header>

    <!-- Pantalla de acceso -->
    <section id="loginScreen" class="login">
      <div class="card login-card">
        <h2>👋 Welcome to the pool</h2>
        <p>
          Enter your name and a personal PIN. You'll use the same name and PIN
          every time to log in and see your points.
        </p>
        <input
          id="usernameInput"
          type="text"
          maxlength="24"
          placeholder="Your name (e.g. Laura G.)"
        />
        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          maxlength="8"
          placeholder="PIN (4–8 digits)"
        />
        <button id="enterBtn" class="btn primary">Enter</button>
        <p class="hint" id="loginHint">
          First time? Pick a PIN to protect your predictions. Forgot it? Ask the
          organizer to look it up for you.
        </p>
      </div>
    </section>

    <!-- App principal -->
    <main id="app" class="hidden">
      <nav class="tabs">
        <button class="tab active" data-tab="predicciones">
          📝 My predictions
        </button>
        <button class="tab" data-tab="clasificacion">📊 Leaderboard</button>
        <button class="tab" data-tab="reglas">📖 Rules</button>
        <button class="tab" data-tab="admin">🔒 Results (admin)</button>
      </nav>

      <div id="banner" class="banner hidden"></div>

      <!-- TAB: Predicciones -->
      <section id="tab-predicciones" class="tab-panel active">
        <div class="panel-toolbar">
          <div class="subtabs" id="predSubtabs">
            <button class="subtab active" data-sub="grupos">
              Group matches
            </button>
            <button class="subtab" data-sub="tablas">Group standings</button>
            <button class="subtab" data-sub="bracket">
              Champion &amp; top scorers
            </button>
            <button class="subtab" data-sub="eliminatorias">Knockouts</button>
          </div>
          <div class="save-bar">
            <span id="saveStatus" class="save-status"></span>
            <button id="resetPredBtn" class="btn ghost small">
              🗑️ Clear my predictions
            </button>
            <button id="savePredBtn" class="btn primary">💾 Save</button>
          </div>
        </div>

        <div id="sub-grupos" class="subpanel active"></div>
        <div id="sub-tablas" class="subpanel"></div>
        <div id="sub-bracket" class="subpanel"></div>
        <div id="sub-eliminatorias" class="subpanel"></div>
      </section>

      <!-- TAB: Clasificación -->
      <section id="tab-clasificacion" class="tab-panel">
        <div id="leaderboard"></div>
      </section>

      <!-- TAB: Reglas -->
      <section id="tab-reglas" class="tab-panel">
        <div id="rules"></div>
      </section>

      <!-- TAB: Admin -->
      <section id="tab-admin" class="tab-panel">
        <div id="adminPanel"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span id="backendInfo"></span>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scoring.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
